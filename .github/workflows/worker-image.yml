name: worker-image

# D1 (Tech Spec workstream D, §3.8 "Cloud" row) — builds and smoke-tests the
# cloud worker container image (cloud/worker/Dockerfile), then publishes it
# to GHCR on tag pushes only. Mirrors engine-ci.yml's shape (paths-filtered
# triggers, one job per concern, printed verification output) but this is a
# separate workflow/file because it triggers on cloud/worker/** independent
# of the engine's own 5-target CI matrix.
#
# OWNER resolution: the published tag is
#   ghcr.io/${{ github.repository_owner }}/lidarscan-worker
# lowercased (GHCR requires a lowercase path). github.repository_owner is
# whatever GitHub account/org the remote lives under — it has no value to
# pin here before that remote exists, and needs no edit once it does: the
# first tag push after the repo exists on GitHub resolves it automatically.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "cloud/worker/**"
      - "engine/**"
      - ".github/workflows/worker-image.yml"
  pull_request:
    paths:
      - "cloud/worker/**"
      - "engine/**"
      - ".github/workflows/worker-image.yml"
  workflow_dispatch: {}

env:
  IMAGE_NAME: lidarscan-worker

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------
  build-and-smoke:
    name: ubuntu-latest / build + in-image smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_ref: ${{ steps.local_tag.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only (push:false, load:true) — this leg exists to prove the
      # image builds and passes its smoke tests on every PR/push that
      # touches cloud/worker/** or engine/**; publishing is a separate,
      # tag-gated job below so a broken engine/ change never reaches GHCR.
      - name: Set local tag
        id: local_tag
        run: echo "ref=${IMAGE_NAME}:ci-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cloud/worker/Dockerfile
          push: false
          load: true
          tags: ${{ steps.local_tag.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image size
        run: docker images "${{ steps.local_tag.outputs.ref }}"

      # The build stage already ran `ctest -R 'engine_cli_(selftest|version|post)'`
      # (engine/CMakeLists.txt's registered ctest names — engine_cli_post IS
      # --post-selftest, see engine/tools/engine_cli.cpp's cmd_post_selftest)
      # as part of the Dockerfile itself, so a broken selftest already fails
      # the build step above. This step re-runs --post-selftest directly
      # against the FINAL runtime-stage image (not the builder stage) to
      # prove the shipped, stripped, runtime-only binary is what passes —
      # the two stages could in principle diverge (a COPY typo, a stale
      # layer) and this is the check that would catch it.
      - name: In-image smoke (--post-selftest against the runtime image)
        run: |
          docker run --rm --entrypoint engine_cli \
            "${{ steps.local_tag.outputs.ref }}" --post-selftest --quiet

      # The fuller contract check: synth-lscan -> entrypoint's real argv
      # convention -> exit-code table -> stdout/stderr separation. Same
      # script a developer runs locally (cloud/worker/README.md).
      - name: Full contract verification (scripts/validate_image.sh)
        run: |
          chmod +x cloud/worker/scripts/validate_image.sh
          cloud/worker/scripts/validate_image.sh --image "${{ steps.local_tag.outputs.ref }}" --no-build

      - name: Save image for the publish job
        if: startsWith(github.ref, 'refs/tags/')
        run: docker save "${{ steps.local_tag.outputs.ref }}" -o /tmp/worker-image.tar

      - name: Upload image artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: worker-image
          path: /tmp/worker-image.tar
          retention-days: 1

  # ---------------------------------------------------------------------
  # Tags only, per the task boundary: "push to GHCR on tags only". A plain
  # branch push or a PR only gets the build-and-smoke job above.
  publish:
    name: ghcr.io publish (tags only)
    needs: build-and-smoke
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: worker-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/worker-image.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute GHCR ref (lowercased owner)
        id: ghcr_ref
        run: |
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          tag="${GITHUB_REF_NAME}"
          echo "base=ghcr.io/${owner_lc}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Tag and push
        run: |
          local_ref="${IMAGE_NAME}:ci-${{ github.sha }}"
          base="${{ steps.ghcr_ref.outputs.base }}"
          tag="${{ steps.ghcr_ref.outputs.tag }}"
          docker tag "$local_ref" "${base}:${tag}"
          docker tag "$local_ref" "${base}:latest"
          docker push "${base}:${tag}"
          docker push "${base}:latest"
          echo "Published:"
          echo "  ${base}:${tag}"
          echo "  ${base}:latest"
