# Reverse proxy + TLS termination in front of the job service.
# The service binds 127.0.0.1 and speaks plain HTTP on purpose: it has no TLS
# stack, no rate limiting and no request logging worth the name. Nginx has all
# three. Nothing but this proxy should be able to reach port 8080.
#
#   /etc/nginx/sites-available/lidarscan  ->  sites-enabled/

server {
    listen 80;
    server_name cloud.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cloud.example.com;

    ssl_certificate     /etc/letsencrypt/live/cloud.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # MUST be at least LIDARSCAN_MAX_UPLOAD_BYTES for a single-PUT client, but
    # the engine client chunks (default 8 MiB), so this only has to exceed one
    # chunk. Keep it small: it is the cheapest DoS brake you have.
    client_max_body_size 64m;

    # Do NOT buffer the upload to a temp file first — it doubles disk traffic
    # and delays the service's own streaming size enforcement.
    proxy_request_buffering off;
    proxy_buffering off;

    # A .lscan upload chunk over a bad link is slow, and a result download of
    # a multi-GB cloud is slower.
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    client_body_timeout   600s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 308 responses (the resume probe) must reach the client untouched.
        proxy_intercept_errors off;
    }

    # /healthz is unauthenticated; do not expose it to the internet.
    location = /healthz {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }
}
