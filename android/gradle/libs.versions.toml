[versions]
# NOTE on this block: AGP is pinned to the 8.x line (not the true "latest
# stable" 9.3.1) because AGP 9 removed the org.jetbrains.kotlin.android
# Gradle plugin in favor of built-in Kotlin support with a DSL this scaffold
# hasn't been ported to yet, and Gradle 9.6+ dropped the internal API AGP
# 8.x relies on (so the wrapper is pinned to 8.14.5, the newest Gradle still
# compatible with AGP 8.13.2). The AndroidX/Compose library versions below
# are similarly held just behind their absolute-latest releases, which have
# started requiring AGP 9.1+ / compileSdk 37. See android/NOTES.md for the
# full explanation and the upgrade path.
agp = "8.13.2"
kotlin = "2.4.10"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2025.09.00"
navigationCompose = "2.8.4"
datastore = "1.1.1"
kotlinxSerialization = "1.7.3"
kotlinxCoroutines = "1.9.0"
junit = "4.13.2"
# B2: D6 USB-serial transport (Tech Spec §3.1 Android row: "usb-serial-for-android (CH340)").
# mik3y's library is JitPack-distributed, not on Maven Central — see settings.gradle.kts
# for the added repository.
usbSerialForAndroid = "3.9.0"
# B4: live 3D point-cloud renderer. The desktop app pins native Filament
# v1.75.0 (desktop/tools/fetch_filament.sh), but Maven Central's
# com.google.android.filament:filament-android AAR only goes up to v1.71.5
# as of this task (confirmed via Maven Central's search API — no 1.72+
# Android AAR is published there yet); v1.71.5 is what this pin follows, and
# android/scripts/fetch_filament_tools.sh fetches the MATCHING v1.71.5 matc
# (not desktop's v1.75.0 one — see that script's header for why a
# version-matched matc matters). Bump this and the fetch script's default
# together when a newer Android AAR ships.
filament = "1.71.5"
# B7: ARCore (Google Play Services for AR). Google's Maven only — not on
# Maven Central. 1.54.0 is the newest published there as of this task, and it
# declares no AAR-metadata minimum (checked), so it works under this project's
# deliberately-pinned AGP 8.13.2 / compileSdk 36 (see the AGP note above).
arcore = "1.54.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
# Named "usbSerial" (not "usb-serial-for-android") so the generated
# libs.usbSerial accessor doesn't contain the Kotlin keyword "for".
usbSerial = { module = "com.github.mik3y:usb-serial-for-android", version.ref = "usbSerialForAndroid" }
# B4: Filament core (Engine/Renderer/View/Scene/VertexBuffer/MaterialInstance)
# + filament-utils (Utils/KTXLoader/Manipulator — this app uses its
# Manipulator for orbit-camera math only, not glTF loading).
filament-android = { module = "com.google.android.filament:filament-android", version.ref = "filament" }
filament-utils-android = { module = "com.google.android.filament:filament-utils-android", version.ref = "filament" }
# B7: ARCore session, poses, camera image + metadata.
arcore = { module = "com.google.ar:core", version.ref = "arcore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
